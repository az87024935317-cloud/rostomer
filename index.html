<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ростомер — игры с ребёнком 0–3</title>
<meta name="theme-color" content="#E8E1D3">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Ростомер">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E8E1D3;
  --card:#F5F1E8;
  --ink:#241F35;
  --ink-soft:#5F5876;
  --edge:#241F35;
  --band:#D9B65A;
  --mot:#B8402C;
  --rech:#2A5F9E;
  --sens:#C07A16;
  --emo:#7B3F8C;
  --mysl:#26714F;
  --shadow:rgba(36,31,53,.18);
}
[data-theme="night"]{
  --paper:#17142A;
  --card:#221D3A;
  --ink:#EFE9DB;
  --ink-soft:#A79FC0;
  --edge:#4A4270;
  --band:#8A7330;
  --mot:#E8705B;
  --rech:#6FA4E0;
  --sens:#E6B54A;
  --emo:#C084D1;
  --mysl:#5CB68C;
  --shadow:rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);color:var(--ink);
  font-family:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:16px;line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:3px solid var(--rech);outline-offset:2px;border-radius:4px}

.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* header */
.top{padding:18px 0 12px;display:flex;align-items:center;gap:12px}
.mark{font-family:'Unbounded',sans-serif;font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1}
.mark span{color:var(--sens)}
.top .grow{flex:1}
.iconbtn{width:42px;height:42px;border:2px solid var(--edge);border-radius:12px;
  display:grid;place-items:center;font-size:17px;background:var(--card)}

/* onboarding */
.onboard{position:fixed;inset:0;z-index:80;background:var(--paper);overflow-y:auto;
  display:grid;align-content:center;padding:32px 0}
.onboard[hidden]{display:none}
.onboard h1{font-family:'Unbounded',sans-serif;font-weight:800;font-size:27px;
  letter-spacing:-.03em;line-height:1.15;margin-bottom:10px}
.onboard .sub{color:var(--ink-soft);font-size:15.5px;margin-bottom:24px}
.field{display:block;margin-bottom:15px}
.field span{display:block;font-size:11.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:7px}
.field input{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--card);
  border:2.5px solid var(--edge);border-radius:13px;padding:13px 14px}
.err{color:var(--mot);font-size:14px;font-weight:600;margin:-6px 0 12px}
.primary{width:100%;background:var(--ink);color:var(--paper);border:2.5px solid var(--ink);
  border-radius:13px;padding:15px;font-size:17px;font-weight:700;margin-top:6px}
.ghost{display:block;width:100%;text-align:center;margin-top:15px;font-size:15px;
  font-weight:600;color:var(--ink-soft);text-decoration:underline}

/* stage bar — signature */
.who{display:flex;align-items:center;gap:8px;border:2.5px solid var(--edge);border-radius:13px;
  background:var(--card);padding:9px 14px;font-size:15.5px;font-weight:700}
.who small{font-weight:500;color:var(--ink-soft);font-size:13px}
.stagebar{position:sticky;top:0;z-index:20;background:var(--paper);
  padding:4px 0 12px;border-bottom:2.5px solid var(--edge)}
.stagerow{display:flex;align-items:center;gap:12px}
.navb{flex:0 0 auto;width:44px;height:44px;border:2.5px solid var(--edge);border-radius:13px;
  background:var(--card);font-size:19px;display:grid;place-items:center}
.navb:disabled{opacity:.28;cursor:default}
.stagemid{flex:1;min-width:0;text-align:center}
.stagenum{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-soft)}
.stagename{font-family:'Unbounded',sans-serif;font-weight:600;font-size:18px;
  letter-spacing:-.03em;line-height:1.2;margin:4px 0 3px}
.stagemo{font-size:13px;color:var(--ink-soft);font-weight:500}
.stairs{display:flex;align-items:flex-end;justify-content:center;gap:4px;height:28px;margin-top:12px}
.stairs button{flex:0 1 28px;background:var(--card);border:2px solid var(--edge);
  border-radius:5px 5px 0 0;padding:0}
.stairs button[data-on="1"]{background:var(--band)}
.stairs button[data-cur="1"]{background:var(--ink);border-color:var(--ink)}
.stagedesc{text-align:center;font-size:13.5px;color:var(--ink-soft);margin-top:10px;line-height:1.35}
.allbtn{display:block;margin:9px auto 0;font-size:13px;font-weight:600;
  color:var(--ink-soft);text-decoration:underline}
.allbtn[aria-pressed="true"]{color:var(--ink)}

/* filters */
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:14px 0 4px}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:2px solid var(--edge);border-radius:999px;padding:7px 13px;
  font-size:14px;font-weight:600;background:var(--card);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.cat[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
[data-theme="night"] .chip.cat[aria-pressed="true"]{color:#17142A}

.count{font-size:13px;color:var(--ink-soft);font-weight:500;padding:10px 2px 0}

/* cards */
.list{display:grid;gap:14px;padding:8px 0 40px}
.card{position:relative;text-align:left;width:100%;background:var(--card);
  border:2.5px solid var(--edge);border-radius:16px;padding:14px 15px 13px;
  box-shadow:5px 5px 0 var(--c);transition:transform .12s ease,box-shadow .12s ease}
.card:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--c)}
.card .stamp{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--c);border:2px solid var(--c);border-radius:6px;padding:2px 7px}
.card h3{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:9px 0 4px;padding-right:34px}
.card p{font-size:14.5px;color:var(--ink-soft);line-height:1.4}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.meta span{font-size:12.5px;font-weight:600;border:1.5px solid var(--edge);opacity:.85;
  border-radius:999px;padding:3px 9px}
.done{position:absolute;top:12px;right:12px;width:30px;height:30px;border:2px solid var(--edge);
  border-radius:9px;display:grid;place-items:center;font-size:15px;background:var(--paper);z-index:2}
.done[aria-pressed="true"]{background:var(--mysl);border-color:var(--mysl);color:#fff}

.empty{border:2.5px dashed var(--edge);border-radius:16px;padding:26px 18px;text-align:center}
.empty b{display:block;font-size:17px;margin-bottom:6px}
.empty p{color:var(--ink-soft);font-size:14.5px}

/* tabs */
.tabs{display:flex;gap:8px;padding:0 0 14px}
.tab{flex:1;border:2.5px solid var(--edge);border-radius:13px;background:var(--card);
  padding:10px 6px;font-size:13px;font-weight:700;line-height:1.2}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* help */
.disclaim{border:2.5px solid var(--mot);color:var(--mot);border-radius:14px;
  padding:12px 14px;font-size:13.5px;font-weight:600;line-height:1.4;margin:2px 0 18px}
.bul{list-style:none;display:grid;gap:9px}
.bul li{position:relative;padding-left:20px;font-size:15.5px}
.bul li::before{content:'';position:absolute;left:2px;top:9px;width:8px;height:8px;
  border-radius:2px;background:var(--c)}
.bul.red li::before{background:var(--mot)}
.redbox{border:2.5px solid var(--mot);border-radius:14px;padding:14px 15px}
.redbox h5{color:var(--mot);font-size:11.5px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;margin-bottom:11px}
.agebox{border:2.5px solid var(--c);border-radius:14px;padding:13px 15px;margin-top:18px}
.agebox h5{color:var(--c);font-size:11.5px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;margin-bottom:8px}
.agebox p{font-size:15px;line-height:1.45}
.agebox p+h5{margin-top:14px}
.fig{background:var(--card);border:2.5px solid var(--edge);border-radius:14px;
  padding:10px 12px 12px;margin-bottom:12px}
.fig svg{width:100%;height:auto;display:block}
.fig p{font-size:14px;color:var(--ink-soft);line-height:1.4;margin-top:8px}
.pics{display:grid;gap:12px;margin-top:14px}
@media (min-width:560px){.pics{grid-template-columns:1fr 1fr}}
.pic{border:2.5px solid var(--edge);border-radius:14px;background:var(--card);padding:10px 12px 12px;margin:0}
.pic svg{width:100%;height:auto;display:block}
.pic figcaption{font-size:13px;color:var(--ink-soft);line-height:1.35;margin-top:6px}

/* books */
.booksec{padding:2px 0 44px}
.booksec>h2{font-family:'Unbounded',sans-serif;font-weight:600;font-size:17px;
  letter-spacing:-.03em;margin:16px 0 14px}
.booksec>h2:first-child{margin-top:2px}
.bookgrp{margin-bottom:22px}
.bookgrp h4{font-size:11.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--c);margin-bottom:10px}
.book{display:block;text-decoration:none;color:inherit;background:var(--card);
  border:2.5px solid var(--edge);border-radius:14px;padding:12px 14px;margin-bottom:10px;
  box-shadow:4px 4px 0 var(--c);transition:transform .12s ease,box-shadow .12s ease}
.book:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--c)}
.book .badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--c);border:2px solid var(--c);border-radius:6px;
  padding:2px 7px;margin-bottom:8px}
.book b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em}
.book i{font-style:normal;font-size:13.5px;color:var(--ink-soft);font-weight:500}
.book p{font-size:14px;color:var(--ink-soft);margin-top:7px;line-height:1.4}
.book em{display:inline-block;font-style:normal;font-size:13px;font-weight:700;
  color:var(--c);margin-top:9px}

/* detail sheet */
.sheet{position:fixed;inset:0;z-index:60;background:var(--paper);overflow-y:auto;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet-top{position:sticky;top:0;background:var(--paper);border-bottom:2px solid var(--edge);
  display:flex;align-items:center;gap:10px;padding:12px 0}
.sheet h2{font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin:20px 0 10px}
.sheet .lede{color:var(--ink-soft);font-size:15.5px}
.sect{margin-top:24px}
.sect h4{font-size:11.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--c);margin-bottom:9px}
.steps{list-style:none;counter-reset:s;display:grid;gap:10px}
.steps li{counter-increment:s;position:relative;padding-left:34px;font-size:15.5px}
.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:24px;height:24px;
  border:2px solid var(--c);color:var(--c);border-radius:8px;display:grid;place-items:center;
  font-size:12px;font-weight:700}
.note{background:var(--card);border:2px solid var(--edge);border-radius:14px;padding:13px 15px;font-size:15px}
.note+.note{margin-top:10px}
.note strong{display:block;font-size:13px;margin-bottom:3px}
.safety{border-color:var(--mot);color:var(--mot)}
.sheet-pad{height:56px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:620px){.list{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<section class="onboard" id="onboard">
  <div class="wrap">
    <div class="mark" style="margin-bottom:24px">РОСТО<span>МЕР</span></div>
    <h1>Когда родился ребёнок?</h1>
    <p class="sub">Дату вводим один раз. Дальше приложение само открывается на том, что подходит сегодня.</p>
    <label class="field"><span>Дата рождения</span><input type="date" id="bdate"></label>
    <label class="field"><span>Имя, если хотите</span><input type="text" id="bname" placeholder="Миша" autocomplete="off"></label>
    <div class="err" id="err" hidden></div>
    <button class="primary" id="go">Показать игры</button>
    <button class="ghost" id="skip">Выбрать ступень вручную</button>
  </div>
</section>

<div class="wrap">
  <header class="top">
    <button class="who" id="who">Ребёнку 7 месяцев</button>
    <div class="grow"></div>
    <button class="iconbtn" id="theme" aria-label="Сменить тему">◐</button>
  </header>
  <div class="tabs" role="tablist">
    <button class="tab" id="tabG" role="tab" aria-selected="true">Игры</button>
    <button class="tab" id="tabH" role="tab" aria-selected="false">Если что-то случилось</button>
    <button class="tab" id="tabB" role="tab" aria-selected="false">Книги</button>
  </div>
</div>

<div class="stagebar" id="stagebar">
  <div class="wrap">
    <div class="stagerow">
      <button class="navb" id="prev" aria-label="Предыдущая ступень">←</button>
      <div class="stagemid">
        <div class="stagenum" id="stnum"></div>
        <div class="stagename" id="stname"></div>
        <div class="stagemo" id="stmo"></div>
      </div>
      <button class="navb" id="next" aria-label="Следующая ступень">→</button>
    </div>
    <div class="stairs" id="stairs" role="group" aria-label="Ступени развития"></div>
    <p class="stagedesc" id="stdesc"></p>
    <button class="allbtn" id="all" aria-pressed="false">показать все игры</button>
  </div>
</div>

<div class="wrap" id="gamesPane">
  <div class="filters" id="cats"></div>
  <div class="count" id="count"></div>
  <div class="list" id="list"></div>
</div>

<div class="wrap" id="helpPane" hidden>
  <p class="disclaim" id="disclaim"></p>
  <div class="list" id="helpList"></div>
</div>

<div class="wrap" id="booksPane" hidden>
  <section class="booksec" id="booksec"></section>
</div>

<section class="sheet" id="sheet" aria-hidden="true">
  <div class="wrap">
    <div class="sheet-top">
      <button class="iconbtn" id="back" aria-label="Назад к списку">←</button>
      <div class="stagemo" id="sheetAge"></div>
    </div>
    <div id="sheetBody"></div>
    <div class="sheet-pad"></div>
  </div>
</section>

<script>
const CATS={
 mot:{n:'Моторика',v:'--mot'}, rech:{n:'Речь',v:'--rech'}, sens:{n:'Сенсорика',v:'--sens'},
 emo:{n:'Связь и чувства',v:'--emo'}, mysl:{n:'Мышление',v:'--mysl'}
};

const GAMES=[
{n:'Лицо в лицо',a:0,b:2,c:'emo',t:5,m:'ничего',
 d:'Первый диалог: вы показываете лицо, он учится его читать.',
 s:['Держите своё лицо на расстоянии 20–25 см — дальше он пока не видит чётко.','Медленно откройте рот, высуньте язык, поднимите брови. Задержитесь.','Ждите 10–20 секунд. Новорождённому нужно много времени на ответ.','Заметили движение губ или языка в ответ — повторите то же самое ещё раз.'],
 w:'Так закладывается очерёдность в общении: я — ты — я. На этом потом строится вся речь.',
 f:'Отворачивается, кряхтит, сжимает кулачки — это перегрузка, а не отказ. Отведите лицо, дайте паузу 30 секунд и попробуйте снова.',
 h:'Добавьте звук: «а-а-а» на его движение. Через месяц он начнёт отвечать гулением.'},

{n:'Контрастная карточка',a:0,b:3,c:'sens',t:3,m:'чёрно-белая картинка или полосатая ткань',
 d:'Зрение пока различает только резкий контраст — дайте ему то, что он реально видит.',
 s:['Положите ребёнка на спину, карточку держите сбоку на 25 см.','Дождитесь, пока он поймает её взглядом.','Медленно ведите к центру и в другую сторону — на счёт «раз-два-три».','Через 2–3 минуты уберите: дольше он не выдержит.'],
 w:'Тренирует слежение глазами — из него потом вырастает умение следить за строчкой в книге.',
 f:'Взгляд соскальзывает — двигайте вдвое медленнее. Отводит глаза — на сегодня хватит.',
 h:'После 2 месяцев меняйте чёрно-белое на крупные цветные пятна.'},

{n:'Время на животе',a:0,b:8,c:'mot',t:3,m:'плотная поверхность, ваша грудь',
 d:'Главное упражнение первого полугодия. Начинать можно с первой недели.',
 s:['Лягте на спину полулёжа, положите ребёнка животом себе на грудь — так проще всего начать.','Позовите его, чтобы он поднял голову на ваш голос.','1–2 минуты, несколько раз в день. Ориентир к 3 месяцам — суммарно около часа за день.','С 2–3 месяцев перекладывайте на пол, игрушку кладите на уровень глаз, а не над головой.'],
 w:'Крепкая шея и спина — основа для переворотов, ползания и потом для того, чтобы сидеть за столом.',
 f:'Кричит через 20 секунд — не отменяйте, а сокращайте: 20 секунд десять раз лучше, чем 3 минуты один раз. Не выкладывайте сразу после еды.',
 h:'Положите перед ним небьющееся зеркало — время на животе сразу удлиняется.'},

{n:'Разговор с паузами',a:0,b:6,c:'rech',t:5,m:'ничего',
 d:'Вы говорите — и замолкаете, оставляя ему место для ответа.',
 s:['Во время переодевания говорите, что делаете: «снимаем носочек».','Замолчите и смотрите на него, считая про себя до восьми.','Любой звук, взгляд или движение ртом в ответ — подхватите его и повторите.','Продолжайте, пока ему интересно.'],
 w:'Ребёнок узнаёт, что его звуки на что-то влияют. Это сильнее любых развивающих карточек.',
 f:'Молчит — не страшно, паузу всё равно оставляйте. Ответы появятся к 2–3 месяцам.',
 h:'К 4 месяцам начните повторять его слоги: он говорит «агу» — вы «агу», и ждёте.'},

{n:'Велосипед и объятие',a:1,b:8,c:'mot',t:4,m:'ничего',
 d:'Разминка на пеленальном столике, заодно помогает при газах.',
 s:['Возьмите ножки под коленями, медленно крутите «велосипед» — 10 кругов.','Подтяните оба колена к животу, задержите на 3 секунды, отпустите.','Скрестите ручки на груди — «обнимаем себя», разведите в стороны. 5 раз.','Всё делайте под счёт или песенку, в одном ритме.'],
 w:'Ребёнок узнаёт границы своего тела и привыкает к ритму движений.',
 f:'Напрягается и выпрямляет ноги — не давите, просто держите ладонь на животе.',
 h:'После 4 месяцев помогайте перевернуться: колено на другую сторону, дальше он доработает сам.'},

{n:'Одна и та же песня',a:0,b:12,c:'emo',t:5,m:'ваш голос',
 d:'Выберите одну колыбельную и пойте только её перед сном.',
 s:['Одна песня, один и тот же порядок действий перед сном.','Пойте тихо и всегда в одном темпе — красота голоса роли не играет.','Не меняйте песню месяцами, даже если надоела вам.'],
 w:'Повторяющийся сигнал помогает мозгу предсказывать, что будет дальше, — а предсказуемость успокаивает.',
 f:'Не засыпает под песню — это нормально, песня не снотворное, а метка «дальше сон».',
 h:'После года он начнёт подпевать последним словам строчек.'},

{n:'Ткани на ладошке',a:1,b:6,c:'sens',t:5,m:'4–5 разных лоскутов',
 d:'Знакомство с фактурами через раскрытую ладонь.',
 s:['Возьмите шёлк, махровое полотенце, вельвет, шерсть, целлофан.','Проведите каждым по тыльной стороне ладони — там кулачок не мешает.','Называйте: «мягкое», «шершавое», «холодное».','Смотрите на реакцию: одни ткани он будет ловить, от других отдёргивать руку.'],
 w:'Разные сигналы от кожи достраивают карту тела и готовят руку к хватанию.',
 f:'Кулачки плотно сжаты — гладьте по внешней стороне кисти, ладонь раскроется сама.',
 h:'После 4 месяцев дайте ткани в руки, чтобы он тянул их и мял.'},

{n:'Достань погремушку',a:3,b:6,c:'mot',t:6,m:'лёгкая погремушка',
 d:'Первое осознанное хватание — рука тянется туда, куда смотрят глаза.',
 s:['Ребёнок на спине. Держите погремушку над грудью, чуть выше вытянутых рук.','Дождитесь, пока он посмотрит, — только потом шевелите ею.','Дайте ему коснуться и обязательно отдайте в руки, когда дотянулся.','Меняйте сторону: слева, справа, по центру.'],
 w:'Соединяются зрение и движение руки. Отсюда начинается вся работа руками.',
 f:'Бьёт мимо — держите игрушку ближе и неподвижно. Точность придёт к 5 месяцам.',
 h:'Держите две игрушки: пусть учится выбирать и брать двумя руками.'},

{n:'Переворот через игрушку',a:3,b:7,c:'mot',t:6,m:'звучащая игрушка',
 d:'Не переворачиваем за него, а даём повод перевернуться самому.',
 s:['Ребёнок на спине. Погремите игрушкой сбоку на уровне его плеча.','Ведите её дальше в сторону, чтобы он поворачивал голову и тянулся.','Когда корпус пошёл за рукой — слегка подтолкните таз, но не переворачивайте целиком.','Оказался на животе — похвалите и оставьте игрушку ему.'],
 w:'Переворот — это первая победа, добытая собственным усилием.',
 f:'Застревает на боку и злится — подождите 10 секунд, прежде чем помогать. Раздражение здесь часть работы.',
 h:'Кладите игрушку чуть дальше — он поедет к ней по-пластунски.'},

{n:'Эхо',a:3,b:12,c:'rech',t:5,m:'ничего',
 d:'Повторяете за ребёнком, а не он за вами.',
 s:['Дождитесь, пока он произнесёт слог: «ба», «гу», «ма».','Повторите ровно то же самое, глядя ему в глаза.','Пауза. Ждите, повторит ли он.','После 3–4 обменов добавьте новый слог — вдруг подхватит.'],
 w:'Ребёнок слышит собственный звук со стороны — так он учится управлять голосом.',
 f:'Замолкает, когда вы говорите, — говорите тише и делайте паузы длиннее.',
 h:'После 8 месяцев складывайте его слог в слово: «ба» → «ба-нан», «мя» → «мяч».'},

{n:'Ку-ку',a:4,b:14,c:'mysl',t:5,m:'пелёнка или ваши ладони',
 d:'Главная игра первого года: вещи не исчезают, даже когда их не видно.',
 s:['Закройте своё лицо ладонями. «Где мама?»','Пауза 2–3 секунды — этого хватает для лёгкого напряжения.','Откройте: «Ку-ку!»','Дальше накрывайте пелёнкой игрушку и ждите, потянет ли он её сам.'],
 w:'Постоянство объекта. Из него растёт спокойствие при расставании: мама ушла — значит, вернётся.',
 f:'Пугается — уменьшите паузу до одной секунды и не закрывайте его самого.',
 h:'После года прячьте игрушку под один из двух платков — пусть вспоминает, под какой.'},

{n:'Мешочки-шуршалки',a:4,b:10,c:'sens',t:6,m:'плотные мешочки с крупой, бумагой, бубенцом',
 d:'Разные звуки в одинаковых на вид мешочках.',
 s:['Сшейте или туго завяжите 3–4 мешочка с разным наполнителем.','Потрясите каждым сбоку от ребёнка, не показывая.','Дайте найти взглядом источник звука, потом отдайте мешочек в руки.','Проверяйте швы перед каждой игрой.'],
 w:'Учит различать звуки на слух — база для различения похожих слов.',
 f:'Пугается резкого — уберите бубенец, оставьте крупу и бумагу.',
 h:'Спрячьте мешочек под платок и дайте искать по звуку.'},

{n:'Коробка сокровищ',a:6,b:14,c:'mysl',t:15,m:'корзинка и 8–10 бытовых предметов',
 d:'Никаких игрушек — только настоящие вещи, которые интересно исследовать.',
 s:['Соберите крупные безопасные предметы: деревянная ложка, силиконовая формочка, щётка, металлическая крышка, лоскут, шишка.','Каждый предмет крупнее кулака ребёнка — ничего, что помещается в рот целиком.','Поставьте корзину перед сидящим ребёнком и отойдите. Не показывайте, что с чем делать.','Сидите рядом молча. Меняйте состав корзины раз в неделю.'],
 w:'Он сам выбирает, что исследовать. Внимание, которое держится 10 минут в год, — целиком его заслуга.',
 f:'Вываливает всё и уходит — нормально, оставьте корзину доступной, вернётся.',
 h:'Добавьте контейнер с крышкой — начнётся игра «положить и достать».',
 safe:'Всё, что проходит через втулку от туалетной бумаги, ребёнок может проглотить. Оставайтесь рядом всю игру.'},

{n:'Барабан из кастрюли',a:6,b:18,c:'sens',t:8,m:'кастрюля, деревянная ложка',
 d:'Пока вы готовите, он открывает, что от его удара зависит громкость.',
 s:['Дайте перевёрнутую кастрюлю и деревянную ложку на полу.','Постучите сами: тихо-тихо, потом громко. Скажите «тихо» и «громко».','Отдайте ложку и не поправляйте технику.','Добавьте вторую поверхность — картонную коробку: звук другой.'],
 w:'«Я стучу — получается звук» — первое понимание причины и следствия.',
 f:'Слишком громко для вас — постелите полотенце под кастрюлю.',
 h:'После года стучите по очереди, повторяя ритм друг за другом.'},

{n:'Из руки в руку',a:5,b:9,c:'mot',t:5,m:'небольшая игрушка',
 d:'Учимся перекладывать предмет между руками.',
 s:['Дайте игрушку в правую руку.','Предложите вторую игрушку с той же стороны — чтобы взять, придётся освободить руку.','Не подсказывайте руками, просто ждите.','Меняйте стороны.'],
 w:'Обе половины мозга начинают работать вместе. Это ступень к тому, чтобы держать чашку и ложку.',
 f:'Роняет первую — так и должно быть в начале, отдайте обратно и повторите.',
 h:'Дайте предмет, который надо взять двумя руками сразу, — мяч или коробку.'},

{n:'Ладушки и сорока',a:6,b:20,c:'rech',t:4,m:'ничего',
 d:'Потешки с движением: ритм, ожидание и щекотка в финале.',
 s:['«Ладушки»: хлопайте его ладошками, держа за запястья.','«Сорока»: водите пальцем по ладони, потом по очереди загибайте пальчики.','Перед последней строчкой сделайте паузу.','Через несколько дней он начнёт подставлять ручки заранее.'],
 w:'Ритм и предсказуемый финал — так дети впервые начинают предвкушать и ждать.',
 f:'Отдёргивает руки — играйте на своих ладонях, он присоединится.',
 h:'Остановитесь перед последним словом и ждите — пусть договорит движением или звуком.'},

{n:'Прятки под платком',a:7,b:16,c:'mysl',t:6,m:'платок, игрушка',
 d:'Ребёнок ищет предмет, который спрятали у него на глазах.',
 s:['Покажите игрушку, накройте платком на его глазах, наполовину оставив снаружи.','«Где мишка?» Пауза.','Когда стянет платок — обрадуйтесь вместе с ним.','Дальше прячьте целиком, потом под один из двух платков.'],
 w:'Память удерживает то, чего сейчас не видно, — основа поиска и планирования.',
 f:'Теряет интерес сразу — оставляйте больше игрушки на виду.',
 h:'Спрячьте, поменяйте платки местами у него на глазах и предложите найти.'},

{n:'Стакан в стакан',a:8,b:20,c:'mysl',t:10,m:'3–4 стаканчика разного размера',
 d:'Размер становится видимым: маленькое входит в большое.',
 s:['Дайте вложенные стаканчики. Пусть сначала просто вынет их.','Покажите один раз, как маленький входит в большой.','Дальше не вмешивайтесь и не исправляйте порядок.','Постройте башню и разрешите её сбить — это половина удовольствия.'],
 w:'Первое сравнение по величине без единого слова про «больше» и «меньше».',
 f:'Только раскидывает — оставьте два стаканчика вместо четырёх.',
 h:'Прячьте под стаканчик мелкую игрушку — получится игра на память.'},

{n:'Пинцетный захват',a:9,b:15,c:'mot',t:8,m:'кукурузные колечки или крупные хлопья',
 d:'Большой и указательный палец учатся работать в паре.',
 s:['Насыпьте несколько колечек на поднос перед сидящим ребёнком.','Возьмите одно двумя пальцами у него на виду и съешьте.','Дальше он работает сам. Не вкладывайте ему в пальцы.','Заканчивайте, пока интерес не пропал.'],
 w:'Тот же захват потом держит карандаш и застёгивает пуговицу.',
 f:'Хватает всей ладонью — нормально до года, просто продолжайте показывать.',
 h:'Предложите опускать колечки в бутылку с узким горлом.',
 safe:'Только под присмотром и только сидя. Никогда не оставляйте ребёнка с мелкой едой одного и не давайте орехи, виноград целиком, сырую морковь.'},

{n:'Дай и на',a:8,b:18,c:'emo',t:5,m:'любой предмет',
 d:'Обмен предметами — первый настоящий диалог без слов.',
 s:['Протяните ему игрушку: «На».','Подставьте раскрытую ладонь: «Дай». Ждите, не забирайте.','Отдал — обязательно верните обратно. Иначе игра закончится.','Повторяйте, пока смешно.'],
 w:'Очерёдность и доверие: то, что я отдал, ко мне возвращается.',
 f:'Не отдаёт — не отбирайте. Меняйте на другой предмет.',
 h:'Добавьте третьего участника и передавайте по кругу.'},

{n:'Где нос?',a:9,b:20,c:'rech',t:5,m:'ничего',
 d:'Понимание слов приходит намного раньше, чем сами слова.',
 s:['Начните с двух частей тела: нос и живот.','«Где нос?» — возьмите его руку и коснитесь своего носа.','Каждый день одно и то же, пару раз, без экзамена.','Через 2–3 недели спрашивайте и ждите — он покажет сам.'],
 w:'Растёт словарь понимания. За ним через несколько месяцев подтягивается говорение.',
 f:'Не показывает — не переспрашивайте по пять раз, просто показывайте сами дальше.',
 h:'Перенесите на игрушку: «Где у мишки нос?» — это уже перенос понятия.'},

{n:'Туннель из стульев',a:8,b:18,c:'mot',t:10,m:'2–3 стула, плед, мяч',
 d:'Ползание через препятствие — работает всё тело сразу.',
 s:['Поставьте стулья в ряд, накройте пледом — получился туннель.','Сядьте с другой стороны и позовите.','Прокатите через туннель мяч, чтобы было за чем ползти.','Не тяните за руки, ждите на выходе.'],
 w:'Перекрёстные движения рук и ног — от них зависит равновесие и потом ходьба.',
 f:'Боится темноты внутри — укоротите туннель до одного стула, чтобы был виден выход.',
 h:'Добавьте подушку на пути — придётся преодолевать подъём.'},

{n:'Книжка-картонка',a:8,b:24,c:'rech',t:6,m:'картонная книга с крупными предметами',
 d:'Читаем не текст, а картинки — и следуем за его пальцем.',
 s:['Посадите ребёнка на колени, книгу держите на уровне глаз.','Не читайте подряд. Показывайте пальцем и называйте: «мяч».','Он ткнул в картинку — назовите именно её, даже если это уже пятый раз.','Захлопнул книгу — заканчивайте, два разворота в этом возрасте достаточно.'],
 w:'Слово привязывается к изображению — это переход от вещей к символам.',
 f:'Только грызёт и листает — это тоже работа с книгой. Не отбирайте.',
 h:'После полутора лет спрашивайте «где мяч?» и ждите, пока покажет сам.'},

{n:'Положить и высыпать',a:10,b:22,c:'mysl',t:12,m:'контейнер, прищепки или крупные пуговицы',
 d:'Бесконечный цикл: наполнить, высыпать, начать заново.',
 s:['Дайте контейнер и 10–15 крупных предметов.','Покажите один раз, как положить внутрь.','Дальше только сидите рядом. Не считайте вслух и не торопите.','Высыпал всё — не собирайте за него сразу, подождите.'],
 w:'Повторение — способ ребёнка убедиться, что мир работает одинаково каждый раз.',
 f:'Разбрасывает по комнате — играйте на пледе, границы помогают.',
 h:'Сделайте прорезь в крышке контейнера — задача станет точнее.'},

{n:'Каталка вперёд',a:10,b:16,c:'mot',t:12,m:'устойчивая каталка или коробка с грузом',
 d:'Толкать перед собой проще, чем идти без опоры.',
 s:['Возьмите каталку, которая не разъезжается: с грузом внутри.','Поставьте ребёнка за неё на ровной поверхности.','Идите рядом, не держа за руки, — пусть регулирует скорость сам.','Дома подойдёт коробка с книгами по гладкому полу.'],
 w:'Тренируется равновесие в движении при сохранении опоры на руки.',
 f:'Каталка укатывается — добавьте веса. Резкий страх падения отбивает желание надолго.',
 h:'Уберите каталку и предложите пронести двумя руками крупный лёгкий предмет — мяч или подушку.'},

{n:'Достраиваем фразу',a:12,b:30,c:'rech',t:5,m:'ничего',
 d:'Он говорит слово — вы возвращаете его же слово плюс одно.',
 s:['Он показывает и говорит: «би-би».','Вы: «да, синяя машина».','Не просите повторить и не исправляйте произношение.','Делайте так весь день по чуть-чуть, а не сессией.'],
 w:'Ребёнок слышит следующую ступень своей же речи — так фразы растут естественно.',
 f:'Молчит и только показывает — называйте сами и добавляйте слово. Требование «скажи» тормозит.',
 h:'После двух лет добавляйте по два слова: «большая синяя машина поехала».'},

{n:'Толстый мелок',a:12,b:30,c:'mot',t:10,m:'восковые мелки, большой лист',
 d:'Первые следы на бумаге — про движение, а не про рисунок.',
 s:['Приклейте большой лист к столу или полу скотчем, чтобы не ездил.','Дайте один толстый мелок — из нескольких он будет только перебирать.','Порисуйте рядом на своём листе, не на его.','Не спрашивайте «что это?» — говорите, что видите: «длинная линия».'],
 w:'Черкание идёт от плеча и локтя. Пальцы подключатся только к трём годам.',
 f:'Рисует на столе — сразу вытрите вместе с ним, спокойно и без лекции.',
 h:'После двух лет покажите круг и линию и предложите повторить.'},

{n:'Убрать в корзину',a:12,b:36,c:'emo',t:8,m:'корзина для игрушек',
 d:'Настоящее дело вместе со взрослым — в этом возрасте это интереснее игры.',
 s:['Держите корзину и предложите: «кубики домой».','Кидайте по одному по очереди: вы — он.','Хвалите действие, а не результат: «ты положил».','Не переделывайте после него.'],
 w:'Быть полезным — сильная потребность после года. Из неё растёт готовность помогать позже.',
 f:'Убирает две вещи и уходит — засчитывайте эти две. Уборка целиком в этом возрасте нереальна.',
 h:'Дайте разложить по двум корзинам: кубики отдельно, машинки отдельно.'},

{n:'Переливание',a:16,b:36,c:'sens',t:12,m:'два стакана, вода, полотенце',
 d:'Занятие, которое держит внимание дольше любой игрушки.',
 s:['Постелите полотенце. Один стакан наполните на треть.','Покажите один раз: медленно перелить, держа двумя руками.','Дальше он льёт сам, сколько захочет.','Пролил — дайте тряпку и вытрите вместе.'],
 w:'Точность движений и внимание к результату. Плюс первое понятие объёма.',
 f:'Устраивает потоп — переносите игру в ванну.',
 h:'Добавьте воронку и мелкое сито или подкрасьте воду и смешивайте два цвета.'},

{n:'Наклейки',a:18,b:36,c:'mot',t:10,m:'лист наклеек, бумага',
 d:'Отклеить сложнее, чем приклеить, — и в этом вся польза.',
 s:['Отогните край наклейки, чтобы было за что взяться.','Дайте отклеивать самому, даже если долго.','Клеить можно куда угодно на его листе — никакого «правильно».','Потом наклейте себе на руку и попросите отклеить обратно.'],
 w:'Работают те же два пальца, что потом держат карандаш.',
 f:'Злится, что не отклеивается — заранее отгибайте уголки на всём листе.',
 h:'Попросите наклеить внутрь нарисованного круга.'},

\" y1=\"100\" x2=\"170\" y2=\"150\" stroke-linecap=\"round\" stroke=\"var(--ink)\" stroke-width=\"24\"/><line x1=\"170\" y1=\"100\" x2=\"170\" y2=\"150\" stroke-linecap=\"round\" stroke=\"var(--paper)\" stroke-width=\"16\"/><line x1=\"190\" y1=\"100\" x2=\"192\" y2=\"150\" stroke-linecap=\"round\" stroke=\"var(--ink)\" stroke-width=\"24\"/><line x1=\"190\" y1=\"100\" x2=\"192\" y2=\"150\" stroke-linecap=\"round\" stroke=\"var(--paper)\" stroke-width=\"16\"/><line x1=\"108\" y1=\"66\" x2=\"176\" y2=\"98\" stroke-linecap=\"round\" stroke=\"var(--ink)\" stroke-width=\"50\"/><line x1=\"108\" y1=\"66\" x2=\"176\" y2=\"98\" stroke-linecap=\"round\" stroke=\"var(--paper)\" stroke-width=\"42\"/><circle cx=\"80\" cy=\"76\" r=\"23\" fill=\"var(--paper)\" stroke=\"var(--ink)\" stroke-width=\"4\"/><line x1=\"112\" y1=\"80\" x2=\"104\" y2=\"118\" stroke-linecap=\"round\" stroke=\"var(--ink)\" stroke-width=\"22\"/><line x1=\"112\" y1=\"80\" x2=\"104\" y2=\"118\" stroke-linecap=\"round\" stroke=\"var(--paper)\" stroke-width=\"14\"/><line x1=\"128\" y1=\"116\" x2=\"164\" y2=\"124\" stroke-linecap=\"round\" stroke=\"var(--ink)\" stroke-width=\"26\"/><line x1=\"128\" y1=\"116\" x2=\"164\" y2=\"124\" stroke-linecap=\"round\" stroke=\"var(--card)\" stroke-width=\"18\"/><line x1=\"126\" y1=\"16\" x2=\"164\" y2=\"24\" stroke-linecap=\"round\" stroke=\"var(--ink)\" stroke-width=\"28\"/><line x1=\"126\" y1=\"16\" x2=\"164\" y2=\"24\" stroke-linecap=\"round\" stroke=\"var(--card)\" stroke-width=\"20\"/><line x1=\"146\" y1=\"38\" x2=\"132\" y2=\"56\" stroke=\"var(--mot)\" stroke-width=\"7\" stroke-linecap=\"round\"/><polygon points=\"132,56 134.4,41.2 145.8,50.0\" fill=\"var(--mot)\"/></svg>"}, {a: 12, b: 36, cap: "Пять толчков в живот. Встаньте сзади, кулак чуть выше пупка, обхватите второй рукой и резко тяните на себя и вверх.", svg: "<svg viewBox=\"0 0 300 180\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><line x1=\"36\" y1=\"172\" x2=\"264\" y2=\"172\" stroke=\"var(--ink)\" stroke-width=\"4\" stroke-linecap=\"round\"/><circle cx=\"150\" cy=\"40\" r=\"22\" fill=\"var(--paper)\" stroke=\"var(--ink)\" stroke-width=\"4\"/><line x1=\"150\" y1=\"86\" x2=\"150\" y2=\"118\" stroke-linecap=\"round\" stroke=\"var(--ink)\" stroke-width=\"58\"/><line x1=\"150\" y1=\"86\" x2=\"150\" y2=\"118\" stroke-linecap=\"round\" stroke=\"var(--paper)\" stroke-width=\"50\"/><line x1=\"139\" y1=\"142\" x2=\"137\" y2=\"166\" stroke-linecap=\"round\" stroke=\"var(--ink)\" stroke-width=\"24\"/><line x1=\"139\" y1=\"142\" x2=\"137\" y2=\"166\" stroke-linecap=\"round\" stroke=\"var(--paper)\" stroke-width=\"16\"/><line x1=\"161\" y1=\"142\" x2=\"163\" y2=\"166\" stroke-linecap=\"round\" stroke=\"var(--ink)\" stroke-width=\"24\"/><line x1=\"161\" y1=\"142\" x2=\"163\" y2=\"166\" stroke-linecap=\"round\" stroke=\"var(--paper)\" stroke-width=\"16\"/><line x1=\"52\" y1=\"92\" x2=\"136\" y2=\"104\" stroke-linecap=\"round\" stroke=\"var(--ink)\" stroke-width=\"23\"/><line x1=\"52\" y1=\"92\" x2=\"136\" y2=\"104\" stroke-linecap=\"round\" stroke=\"var(--card)\" stroke-width=\"15\"/><line x1=\"248\" y1=\"92\" x2=\"164\" y2=\"104\" stroke-linecap=\"round\" stroke=\"var(--ink)\" stroke-width=\"23\"/><line x1=\"248\" y1=\"92\" x2=\"164\" y2=\"104\" stroke-linecap=\"round\" stroke=\"var(--card)\" stroke-width=\"15\"/><circle cx=\"150\" cy=\"100\" r=\"15\" fill=\"var(--band)\" stroke=\"var(--ink)\" stroke-width=\"4\"/><circle cx=\"150\" cy=\"118\" r=\"4\" fill=\"var(--ink)\"/><line x1=\"202\" y1=\"134\" x2=\"174\" y2=\"102\" stroke=\"var(--mot)\" stroke-width=\"7\" stroke-linecap=\"round\"/><polygon points=\"174,102 188.1,107.2 177.3,116.6\" fill=\"var(--mot)\"/></svg>"}],
 lead:'Главное — сначала понять, кашляет он или нет. От этого зависит, вмешиваться руками или не трогать.',
 an:[{a:0,b:11,l:'До года',pic:'infant',x:'Толчки в живот детям до года запрещены — можно повредить внутренние органы. Только пять ударов по спине и пять толчков в грудь двумя пальцами по нижней части грудины. Держите его лицом вниз на своём предплечье, головой ниже туловища. И помните, что опасна не только еда: всё, что проходит через втулку от туалетной бумаги, ребёнок может вдохнуть.'},
   {a:12,b:23,l:'От года до двух',pic:'child',x:'После года схема меняется: пять ударов по спине, затем пять толчков в живот. Встаньте сзади, кулак чуть выше пупка, обхватите второй рукой и резко тяните на себя и вверх. Самые частые виновники в этом возрасте — целый виноград, орехи, сырая морковь, попкорн и сосиски кружочками. Виноград и сосиски режьте вдоль на четвертинки, орехи не давайте вовсе.'},
   {a:24,b:36,l:'После двух лет',pic:'child',x:'Он ест на бегу, смеётся и разговаривает с полным ртом — именно так чаще всего и давятся. Правило простое и не обсуждается: едим только сидя. В этом возрасте уже можно научить его показывать на горло и говорить «застряло».'}],
 now:['Сначала посмотрите, может ли он кашлять, плакать или говорить. Если может — руками не лезьте. Собственный кашель выталкивает еду лучше любого приёма; стойте рядом и подбадривайте кашлять.',
   'Если он не может дышать и издавать звуки, хватается за горло, лицо краснеет, а потом синеет — начинайте помогать сразу и одновременно просите кого-нибудь вызвать скорую.',
   'Пять ударов основанием ладони между лопатками. Ребёнок наклонён вперёд, голова ниже туловища.',
   'Потом пять толчков: до года — в грудь двумя пальцами, после года — в живот, обхватив сзади. После каждой серии заглядывайте в рот.',
   'Чередуйте пять ударов и пять толчков, пока предмет не выйдет или не приедет скорая. Не останавливайтесь, даже если кажется, что не помогает.',
   'Если потерял сознание — положите на твёрдое и начинайте сердечно-лёгочную реанимацию, не прекращая до приезда врачей.'],
 calm:['После приступа он сильно напуган, и вы тоже. Возьмите на руки и дышите медленно сами — он подхватит ваш ритм.',
   'Говорите тихо и коротко: «застряло, вышло, всё хорошо, я рядом». Длинные объяснения сейчас не работают.',
   'Не пересказывайте случившееся по телефону тревожным голосом при нём.',
   'В следующий раз садитесь есть спокойно и без напоминаний об эпизоде — иначе закрепится страх еды.'],
 red:['не может кашлять, плакать или издавать звуки',
   'хватается за горло, открывает рот, но вдохнуть не получается',
   'губы и лицо синеют или сереют',
   'дыхание со свистом, очень слабое или пропало',
   'обмяк, потерял сознание',
   'вы не уверены, вышел предмет или нет'],
 doc:['делали толчки в живот — покажите врачу обязательно, даже если ребёнок уже весел',
   'остался кашель, хрип или свист при дыхании: часть могла уйти в дыхательные пути',
   'больно глотать, течёт слюна, отказывается есть и пить',
   'был эпизод посинения или потери сознания'],
 no:['Не суйте пальцы в горло вслепую — так предмет проталкивается глубже. Доставать можно, только если он хорошо виден и легко подцепляется.',
   'Не переворачивайте вниз головой и не трясите.',
   'Не давайте пить и не пытайтесь протолкнуть застрявшее хлебом.',
   'Не делайте толчки в живот ребёнку до года.',
   'Не хлопайте по спине того, кто кашляет и дышит: можно сбить кашель и сделать хуже.']},

{t:'Упал, ударился',c:'--mot',
 lead:'Что сделать в первые минуты и по каким признакам ехать в больницу.',
 an:[{a:0,b:6,l:'До полугода',x:'В этом возрасте любой удар головой стоит показать врачу, даже если ребёнок быстро успокоился: кости черепа тонкие, а признаки бывают стёртыми. Отдельно смотрите на родничок — если он выбухает и напряжён, это скорая. Падение с пеленального столика или дивана — всегда повод для осмотра.'},
   {a:7,b:17,l:'От полугода до полутора лет',x:'Он падает по многу раз в день, и это часть обучения ходьбе. Смотрите не на сам факт падения, а на высоту: опасны падения с высоты его роста и выше — со стула, кровати, лестницы. Шлепок на попу с высоты собственного сидения обычно не требует ничего, кроме объятия.'},
   {a:18,b:36,l:'После полутора лет',x:'Уже может показать, где болит, но начинает скрывать падение, если вы резко реагируете. Спрашивайте спокойно и не устраивайте допрос — иначе про следующий удар головой вы просто не узнаете.'}],
 now:['Не хватайте рывком. Сначала посмотрите: двигает ли руками и ногами, реагирует ли на вас как обычно.',
   'Возьмите на руки и говорите тихо. Ребёнок считывает ваше лицо: ваша паника пугает сильнее самого падения.',
   'Приложите холод через ткань на 10–15 минут — не лёд напрямую к коже.',
   'Ближайшие сутки держите день спокойным и наблюдайте. Спать можно; просто время от времени убеждайтесь, что он легко просыпается и ведёт себя обычно.'],
 calm:['Назовите чувство вслух: «испугался, ударился, я рядом». Признание работает лучше отвлечения.',
   'Не ругайте за падение — иначе в следующий раз он скроет, что упал.',
   'Дайте посидеть у вас на руках столько, сколько нужно ему, а не сколько удобно вам.',
   'Не обсуждайте случившееся при нём тревожным голосом по телефону.'],
 red:['потерял сознание, даже на пару секунд',
   'судороги',
   'рвота, особенно если повторяется',
   'вялый, не разбудить, взгляд не фокусируется',
   'кровь или прозрачная жидкость из носа или уха',
   'зрачки разного размера',
   'не двигает рукой или ногой, не может сидеть и стоять как раньше',
   'вмятина на черепе или быстро растущая шишка у младенца'],
 doc:['ребёнку меньше 6 месяцев — покажите врачу при любом ударе головой',
   'упал с высоты больше собственного роста, с пеленального столика или по лестнице',
   'плачет дольше обычного и не успокаивается привычным способом',
   'необычно вялый, хуже ест, отказывается от игры'],
 no:['Не растирайте место удара и не мажьте согревающим.',
   'Не давайте обезболивающее «на всякий случай» перед визитом к врачу — оно смажет картину. Сначала спросите врача.',
   'Не будите каждые полчаса всю ночь: недосып и тревога вредят обоим. Достаточно проверять, что он нормально реагирует.']},

{t:'Не хочет есть',c:'--mysl',
 lead:'Почти всегда это норма роста, а не болезнь. Но есть признаки, при которых нужен врач.',
 an:[{a:0,b:5,l:'До полугода',x:'Вся еда — молоко или смесь. Отказ от нескольких кормлений подряд здесь не каприз, а повод звонить врачу в тот же день. Главный домашний ориентир — мокрые подгузники: шесть и больше за сутки означают, что жидкости хватает. Всё, что написано ниже про выбор и порции, к этому возрасту не относится.'},
   {a:6,b:11,l:'Первый год, прикорм',x:'Прикорм — это знакомство со вкусом и ложкой, а не питание: основное по-прежнему молоко или смесь. Отказ от новой еды в этом возрасте не значит ничего, просто предлагайте дальше. Не заменяйте молоко кашей ради объёма и не догоняйте норму любой ценой.'},
   {a:12,b:36,l:'После года',x:'Аппетит закономерно падает: ребёнок растёт втрое медленнее, чем на первом году. Добавляется страх новой еды — это возрастная норма, она проходит годам к пяти. Именно к этому возрасту относится всё, что написано ниже про разделение ответственности и размер порции.'}],
 now:['Проверьте, не больно ли: загляните в рот, потрогайте дёсны, измерьте температуру, посмотрите, дышит ли нос свободно.',
   'Предлагайте еду по режиму, а между приёмами — только воду. Перекусы и сок отбивают аппетит надёжнее всего.',
   'Порция размером с его кулак. Маленькая тарелка и добавка по просьбе — лучше, чем полная и «доедай».',
   'Садитесь есть вместе и ту же еду. В этом возрасте копирование работает сильнее уговоров.',
   'Смотрите на неделю, а не на день: дети едят очень неровно.'],
 calm:['Разделите ответственность: вы решаете, что и когда на столе, он — сколько съесть и есть ли вообще.',
   'Отказ не должен вызывать бурю. Спокойно уберите тарелку через 20–30 минут без комментариев.',
   'Новый продукт может понадобиться предложить десять и больше раз. Без давления, просто рядом на тарелке.',
   'После года аппетит естественно падает — ребёнок растёт медленнее, чем на первом году.'],
 red:['не пьёт вообще или почти не мочится: меньше 3–4 мокрых подгузников в сутки',
   'сухие губы, нет слёз при плаче, запавший родничок, вялость — это обезвоживание',
   'младенец до 6 месяцев отказывается от груди или бутылки несколько кормлений подряд',
   'не может проглотить слюну, течёт слюна, больно глотать',
   'отказ от еды вместе с температурой, рвотой или поносом'],
 doc:['отказывается есть дольше нескольких дней подряд',
   'теряет вес или перестал прибавлять',
   'давится и кашляет во время еды',
   'ест только 3–5 продуктов и не расширяет список'],
 no:['Не кормите под мультики: так он перестаёт замечать сытость.',
   'Не обещайте сладкое за съеденный суп — это делает обычную еду наказанием.',
   'Не заставляйте доедать и не докармливайте насильно.',
   'Не подкармливайте печеньем между приёмами, если он не поел за столом.']},

{t:'Поднялась температура',c:'--sens',
 lead:'Температура — работа иммунитета, а не сама болезнь. Смотрят на самочувствие, а не на цифру.',
 an:[{a:0,b:2,l:'До трёх месяцев',x:'38 и выше — звоните сразу, не наблюдайте и не давайте жаропонижающее до разговора с врачом. В этом возрасте «просто температуры» не бывает, и ребёнок может выглядеть спокойным при серьёзной инфекции.'},
   {a:3,b:11,l:'Первый год',x:'Температура в первые двое суток после прививки — обычное дело. А вот на зубы списывать нельзя: прорезывание даёт максимум небольшой подъём, и 38,5 и выше зубами не объясняется. До полугода при 39 и выше звоните врачу, не дожидаясь утра.'},

let stage=3, months=null, childName='', allGames=false, cat=null;
const done=new Set();

const $=id=>document.getElementById(id);
const ageWord=m=>{const n=m%100>4&&m%100<21?'месяцев':['месяцев','месяц','месяца','месяца','месяца','месяцев','месяцев','месяцев','месяцев','месяцев'][m%10];return n};
function ageLabel(m){
  if(m<12)return m+' '+ageWord(m);
  const y=Math.floor(m/12),r=m%12;
  return y+(y===1?' год':' года')+(r?' '+r+' мес':'');
}

// ступени
const stairs=$('stairs');
STAGES.forEach((st,i)=>{
  const b=document.createElement('button');
  b.style.height=(9+i*2)+'px';
  b.setAttribute('aria-label','Ступень '+(i+1)+': '+st.n);
  b.onclick=()=>{stage=i;allGames=false;render()};
  stairs.appendChild(b);
});
$('prev').onclick=()=>{if(stage>0){stage--;allGames=false;render()}};
$('next').onclick=()=>{if(stage<STAGES.length-1){stage++;allGames=false;render()}};
$('all').onclick=()=>{allGames=!allGames;render()};

// возраст в полных месяцах
function monthsSince(iso){
  const b=new Date(iso+'T00:00:00'), n=new Date();
  let m=(n.getFullYear()-b.getFullYear())*12+(n.getMonth()-b.getMonth());
  if(n.getDate()<b.getDate())m--;
  return m;
}
const stageForMonth=m=>{
  const i=STAGES.findIndex(s=>m<=s.b);
  return i<0?STAGES.length-1:i;
};

$('bdate').max=new Date().toISOString().slice(0,10);
$('go').onclick=()=>{
  const v=$('bdate').value, e=$('err');
  if(!v){e.textContent='Введите дату рождения или выберите ступень вручную.';e.hidden=false;return}
  const m=monthsSince(v);
  if(m<0){e.textContent='Дата ещё не наступила. Проверьте год.';e.hidden=false;return}
  e.hidden=true;
  months=m;childName=$('bname').value.trim();stage=stageForMonth(m);
  $('onboard').hidden=true;render();
};
$('skip').onclick=()=>{months=null;childName='';$('onboard').hidden=true;render()};
$('who').onclick=()=>{$('onboard').hidden=false;$('err').hidden=true};

// filter chips
function chips(host,map,get,set,isCat){
  host.innerHTML='';
  for(const k in map){
    const b=document.createElement('button');
    b.className='chip'+(isCat?' cat':'');
    b.textContent=isCat?map[k].n:map[k];
    if(isCat)b.style.setProperty('--c','var('+map[k].v+')');
    b.setAttribute('aria-pressed',get()===k);
    b.onclick=()=>{set(get()===k?null:k);render()};
    host.appendChild(b);
  }
}

function match(g){
  const st=STAGES[stage];
  const byStage=allGames||(g.a<=st.b&&g.b>=st.a);
  return byStage&&(!cat||g.c===cat);
}

function render(){
  const st=STAGES[stage];
  $('who').innerHTML='';
  const who=months===null?'Ступень выбрана вручную':(childName?childName:'Ребёнку')+' '+ageLabel(months);
  $('who').append(who,Object.assign(document.createElement('small'),{textContent:'изменить'}));
  $('stnum').textContent='Ступень '+(stage+1)+' из '+STAGES.length;
  $('stname').textContent=st.n;
  $('stmo').textContent='обычно '+st.a+'–'+st.b+' мес';
  $('stdesc').textContent=allGames?'Показаны игры всех ступеней.':st.d;
  $('all').setAttribute('aria-pressed',allGames);
  $('all').textContent=allGames?'вернуться к ступени':'показать все игры';
  $('prev').disabled=stage===0;
  $('next').disabled=stage===STAGES.length-1;
  [...stairs.children].forEach((b,i)=>{
    b.dataset.on=i<stage?'1':'0';
    b.dataset.cur=i===stage?'1':'0';
    b.setAttribute('aria-current',i===stage?'true':'false');
  });
  chips($('cats'),CATS,()=>cat,v=>cat=v,true);

  const found=GAMES.filter(match);
  $('count').textContent=found.length?found.length+' '+(found.length%10===1&&found.length%100!==11?'игра':'игр')+' · сыграли '+done.size+' из '+GAMES.length:'';

  const list=$('list');list.innerHTML='';
  if(!found.length){
    list.innerHTML='<div class="empty"><b>Под эти фильтры игр нет</b><p>Снимите один фильтр или перейдите на соседнюю ступень.</p></div>';
    return;
  }
  found.forEach(g=>{
    const c=document.createElement('div');
    c.className='card';c.style.setProperty('--c','var('+CATS[g.c].v+')');
    c.innerHTML='<span class="stamp">'+CATS[g.c].n+'</span>'+
      '<h3></h3><p></p><div class="meta"><span>'+g.t+' мин</span><span>'+ageLabel(g.a)+' – '+ageLabel(g.b)+'</span></div>';
    c.querySelector('h3').textContent=g.n;
    c.querySelector('p').textContent=g.d;
    c.onclick=()=>open(g);
    c.tabIndex=0;c.setAttribute('role','button');
    c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open(g)}};

    const d=document.createElement('button');
    d.className='done';d.textContent='✓';
    d.setAttribute('aria-pressed',done.has(g.n));
    d.setAttribute('aria-label','Отметить, что играли: '+g.n);
    d.onclick=e=>{e.stopPropagation();done.has(g.n)?done.delete(g.n):done.add(g.n);render()};
    c.appendChild(d);
    list.appendChild(c);
  });
}

function bookAge(b){
  if(b.a===0&&b.b===36)return 'на все три года';
  if(b.b===36)return 'с '+b.a+' мес';
  return b.a+'–'+b.b+' мес';
}

function renderBooks(){
  const host=$('booksec');host.innerHTML='';
  // «сейчас» считаем по возрасту ребёнка, а если даты нет — по выбранной ступени
  const st=STAGES[stage];
  // возраст больше не делит список на группы, но подходящее сейчас идёт первым
  const fits=b=>months===null?(b.a<=st.b&&b.b>=st.a):(months>=b.a&&months<=b.b);
  const rec=BOOKS.filter(b=>b.rec);
  const other=[...BOOKS.filter(b=>!b.rec&&fits(b)),...BOOKS.filter(b=>!b.rec&&!fits(b))];

  const group=(title,items,color)=>{
    if(!items.length)return;
    const h=document.createElement('h2');h.textContent=title;host.appendChild(h);
    const g=document.createElement('div');
    g.className='bookgrp';g.style.setProperty('--c','var('+color+')');
    items.forEach(bk=>{
      const a=document.createElement('a');
      a.className='book';a.href=bk.u||BOOK_LINK(bk.t+' '+bk.au);
      a.target='_blank';a.rel='noopener noreferrer';
      a.innerHTML='<span class="badge"></span><b></b><i></i><p></p><em></em>';
      a.querySelector('.badge').textContent=bookAge(bk);
      a.querySelector('b').textContent=bk.t;
      a.querySelector('i').textContent=bk.au;
      a.querySelector('p').textContent=bk.w;
      a.querySelector('em').textContent=bk.ul||'найти книгу →';
      g.appendChild(a);
    });
    host.appendChild(g);
  };

  group('Что советуют родители',rec,'--sens');
  group('Что почитать ещё',other,'--emo');
}

// вкладки
let tab='g';
function setTab(t){
  tab=t;
  $('tabG').setAttribute('aria-selected',t==='g');
  $('tabH').setAttribute('aria-selected',t==='h');
  $('tabB').setAttribute('aria-selected',t==='b');
  $('stagebar').hidden=t!=='g';
  $('gamesPane').hidden=t!=='g';
  $('helpPane').hidden=t!=='h';
  $('booksPane').hidden=t!=='b';
  if(t==='b')renderBooks();
  window.scrollTo(0,0);
}
$('tabG').onclick=()=>setTab('g');
$('tabH').onclick=()=>setTab('h');
$('tabB').onclick=()=>setTab('b');

$('disclaim').textContent='Это не замена осмотру. Если сомневаетесь — звоните врачу. Сомнение само по себе достаточный повод для звонка.';

function renderHelp(){
  const host=$('helpList');host.innerHTML='';
  HELP.forEach(h=>{
    const c=document.createElement('div');
    c.className='card';c.style.setProperty('--c','var('+h.c+')');
    c.innerHTML='<span class="stamp">первая помощь</span><h3></h3><p></p>';
    c.querySelector('h3').textContent=h.t;
    c.querySelector('p').textContent=h.lead;
    c.tabIndex=0;c.setAttribute('role','button');
    c.onclick=()=>openHelp(h);
    c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openHelp(h)}};
    host.appendChild(c);
  });
}

function fill(el,arr,cls){
  const ul=document.createElement('ul');
  ul.className='bul'+(cls?' '+cls:'');
  arr.forEach(t=>{const li=document.createElement('li');li.textContent=t;ul.appendChild(li)});
  el.appendChild(ul);
}

function openHelp(h){
  const s=$('sheet'),b=$('sheetBody');
  b.style.setProperty('--c','var('+h.c+')');
  $('sheetAge').textContent='Если что-то случилось';
  b.innerHTML='<h2></h2><p class="lede"></p>';
  b.querySelector('h2').textContent=h.t;
  b.querySelector('.lede').textContent=h.lead;

  // возрастная поправка: если дата рождения известна — только своя, иначе все
  if(h.an&&h.an.length){
    const box=document.createElement('div');box.className='agebox';
    const mine=months===null?null:h.an.find(n=>months>=n.a&&months<=n.b);
    (mine?[mine]:h.an).forEach(n=>{
      const t=document.createElement('h5');
      t.textContent=mine?'Вашему ребёнку сейчас · '+n.l:n.l;
      const p=document.createElement('p');p.textContent=n.x;
      box.append(t,p);
    });
    b.appendChild(box);

    // схемы приёмов — только те, что соответствуют показанным поправкам
    const groups=[...new Set((mine?[mine]:h.an).map(n=>n.pic).filter(Boolean))];
    groups.forEach(key=>{
      const wrap=document.createElement('div');
      wrap.className='pics';wrap.style.setProperty('--c','var('+h.c+')');
      PICS[key].forEach(pic=>{
        const fig=document.createElement('figure');
        fig.className='pic';
        fig.innerHTML=pic.s+'<figcaption></figcaption>';
        fig.querySelector('figcaption').textContent=pic.c;
        wrap.appendChild(fig);
      });
      b.appendChild(wrap);
    });
  }

  const sec=(title,arr,ordered)=>{
    const d=document.createElement('div');d.className='sect';
    const t=document.createElement('h4');t.textContent=title;d.appendChild(t);
    if(ordered){
      const ol=document.createElement('ol');ol.className='steps';
      arr.forEach(x=>{const li=document.createElement('li');li.textContent=x;ol.appendChild(li)});
      d.appendChild(ol);
    } else fill(d,arr);
    b.appendChild(d);
  };

  sec('Что делать сейчас',h.now,true);

  // схемы приёмов — только те, что подходят возрасту ребёнка
  if(h.fig&&h.fig.length){
    const mine=months===null?h.fig:h.fig.filter(f=>months>=f.a&&months<=f.b);
    if(mine.length){
      const d=document.createElement('div');d.className='sect';
      const t=document.createElement('h4');t.textContent='Как это делается';d.appendChild(t);
      mine.forEach(f=>{
        const box=document.createElement('div');box.className='fig';
        box.innerHTML=f.svg;
        const p=document.createElement('p');p.textContent=f.cap;
        box.appendChild(p);d.appendChild(box);
      });
      b.appendChild(d);
    }
  }

  const red=document.createElement('div');red.className='sect';
  const box=document.createElement('div');box.className='redbox';
  const rh=document.createElement('h5');rh.textContent='Скорая '+SOS+' — немедленно, если';
  box.appendChild(rh);fill(box,h.red,'red');red.appendChild(box);b.appendChild(red);

  sec('Врачу — сегодня или завтра',h.doc);
  sec('Как его успокоить',h.calm);
  sec('Чего не делать',h.no);

  const pad=document.createElement('div');pad.className='sheet-pad';b.appendChild(pad);
  s.classList.add('open');s.setAttribute('aria-hidden','false');s.scrollTop=0;
  document.body.style.overflow='hidden';
  $('back').focus();
}

function open(g){
  const s=$('sheet'),b=$('sheetBody');
  b.style.setProperty('--c','var('+CATS[g.c].v+')');
  $('sheetAge').textContent=ageLabel(g.a)+' – '+ageLabel(g.b)+' · '+g.t+' мин';
  b.innerHTML=
    '<h2></h2><p class="lede"></p>'+
    (g.m?'<div class="sect"><h4>Что нужно</h4><div class="note" id="mm"></div></div>':'')+
    '<div class="sect"><h4>Как играть</h4><ol class="steps" id="ss"></ol></div>'+
    (g.safe?'<div class="sect"><div class="note safety"><strong>Безопасность</strong><span id="sf"></span></div></div>':'')+
    '<div class="sect"><h4>Зачем это</h4><div class="note" id="ww"></div></div>'+
    '<div class="sect"><h4>Если не получается</h4><div class="note" id="ff"></div></div>'+
    '<div class="sect"><h4>Когда станет легко</h4><div class="note" id="hh"></div></div>';
  b.querySelector('h2').textContent=g.n;
  b.querySelector('.lede').textContent=g.d;
  if(g.m)$('mm').textContent=g.m;
  if(g.safe)$('sf').textContent=g.safe;
  $('ww').textContent=g.w;$('ff').textContent=g.f;$('hh').textContent=g.h;
  const ol=$('ss');
  g.s.forEach(t=>{const li=document.createElement('li');li.textContent=t;ol.appendChild(li)});
  s.classList.add('open');s.setAttribute('aria-hidden','false');s.scrollTop=0;
  document.body.style.overflow='hidden';
  $('back').focus();
}
$('back').onclick=()=>{
  const s=$('sheet');s.classList.remove('open');s.setAttribute('aria-hidden','true');
  document.body.style.overflow='';
};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('sheet').classList.contains('open'))$('back').click()});

$('theme').onclick=()=>{
  const n=document.documentElement.getAttribute('data-theme')==='night';
  document.documentElement.setAttribute('data-theme',n?'day':'night');
  document.querySelector('meta[name=theme-color]').content=n?'#E8E1D3':'#17142A';
};

renderHelp();
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
